  build-apk-alpine:
    name: Build .apk (Alpine ${{ needs.detect-versions.outputs.alpine_release }})
    runs-on: ubuntu-latest
    needs:
      - detect-versions
    container:
      image: alpine:${{ needs.detect-versions.outputs.alpine_release }}
    defaults:
      run:
        shell: sh
    steps:
      - name: Install build tools
        run: |
          apk add --no-cache \
            git build-base abuild libpcap-dev linux-headers curl sudo

      - name: Set up abuild user
        run: |
          adduser -D builder
          addgroup builder abuild
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          mkdir -p /home/builder/.abuild
          openssl genrsa -out /home/builder/.abuild/builder.rsa 2048
          openssl rsa -in /home/builder/.abuild/builder.rsa \
            -pubout -out /home/builder/.abuild/builder.rsa.pub
          cp /home/builder/.abuild/builder.rsa.pub /etc/apk/keys/
          printf 'PACKAGER_PRIVKEY="/home/builder/.abuild/builder.rsa"\n' \
            > /home/builder/.abuild/abuild.conf
          chown -R builder:builder /home/builder

      - name: Mark workspace as safe for git
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Build .apk package
        run: |
          set -eu
          NEIGHBOT_VERSION=$(grep '#define NEIGHBOT_VERSION' neighbot.h | sed 's/.*"\(.*\)"/\1/')
          make oui.txt
          prefix="neighbot-${NEIGHBOT_VERSION}"
          git archive --format=tar --prefix="${prefix}/" HEAD > "${prefix}.tar"
          tar --append --file="${prefix}.tar" --transform="s|^|${prefix}/|" oui.txt
          gzip "${prefix}.tar"

          mkdir -p /home/builder/build
          cp alpine/APKBUILD /home/builder/build/
          sed -i "s/^pkgver=.*/pkgver=${NEIGHBOT_VERSION}/" /home/builder/build/APKBUILD
          cp "${prefix}.tar.gz" /home/builder/build/
          chown -R builder:builder /home/builder/build

          cd /home/builder/build
          su builder -c "abuild checksum"
          su builder -c "abuild -r"

      - name: Collect artifacts
        run: |
          set -eu
          ALPINE_VER="${{ needs.detect-versions.outputs.alpine_release }}"
          mkdir -p artifacts/apk
          find /home/builder/packages -name '*.apk' -print | while read -r pkg; do
            base=$(basename "$pkg")
            namever=${base%%.apk}
            cp "$pkg" "artifacts/apk/${namever}.alpine.${ALPINE_VER}.apk"
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: apk-packages-alpine-${{ needs.detect-versions.outputs.alpine_release }}
          path: artifacts/apk/
          if-no-files-found: error

  build-tgz-openbsd:
    name: Build .tgz (OpenBSD ${{ matrix.version }})
    runs-on: ubuntu-latest
    needs:
      - detect-versions
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.detect-versions.outputs.openbsd_releases) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Build .tgz in OpenBSD VM
        uses: vmactions/openbsd-vm@v1
        with:
          release: ${{ matrix.version }}
          usesh: true
          copyback: true
          prepare: |
            # libpcap is in base; pkg_create is in base
          run: |
            set -e
            ver=$(grep '#define NEIGHBOT_VERSION' neighbot.h | sed 's/.*"\(.*\)"/\1/')
            make
            mkdir -p stage/usr/local/sbin stage/usr/local/share/man/man8 stage/etc/rc.d
            install -m 755 neighbot stage/usr/local/sbin/neighbot
            install -m 644 neighbot.8 stage/usr/local/share/man/man8/neighbot.8
            install -m 755 neighbot.rc stage/etc/rc.d/neighbot
            mkdir -p artifacts
            # pkg_create derives the @name from the output filename and
            # rejects anything that doesn't parse as name-version, so
            # build with the canonical name then rename to embed the
            # OS version only in the release-asset filename.
            pkg_create \
              -B "$(pwd)/stage" \
              -p /usr/local \
              -A "*" \
              -d openbsd/DESCR \
              -D COMMENT="network neighbor monitoring daemon" \
              -D MAINTAINER="Renaud Allard <renaud@allard.it>" \
              -D HOMEPAGE="https://github.com/renaudallard/neighbot" \
              -D CATEGORIES="net security" \
              -f openbsd/PLIST \
              "neighbot-${ver}.tgz"
            mv "neighbot-${ver}.tgz" \
               "artifacts/neighbot-${ver}-openbsd${{ matrix.version }}.tgz"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: openbsd-packages-${{ matrix.version }}
          path: artifacts/
          if-no-files-found: error

  publish:
    name: Upload Release Assets
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - resolve-tag
      - detect-versions
      - build-deb-ubuntu-stable
      - build-deb-ubuntu-lts
      - build-deb-debian-stable
      - build-deb-debian-oldstable
      - build-rpm-fedora
      - build-rpm-rocky
      - build-rpm-rocky-previous
      - build-rpm-opensuse
      - build-rpm-suse
      - build-apk-alpine
      - build-tgz-openbsd
    steps:
      - name: Download .deb artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: deb-packages-*
          path: release-assets/deb
          merge-multiple: true

      - name: Download .rpm artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: rpm-packages-*
          path: release-assets/rpm
          merge-multiple: true

      - name: Download .apk artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: apk-packages-*
          path: release-assets/apk
          merge-multiple: true

      - name: Download OpenBSD artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: openbsd-packages-*
          path: release-assets/openbsd
          merge-multiple: true

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ needs.resolve-tag.outputs.tag }}
          files: |
            release-assets/deb/*.deb
            release-assets/rpm/*.rpm
            release-assets/apk/*.apk
            release-assets/openbsd/*.tgz
