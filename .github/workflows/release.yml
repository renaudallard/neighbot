name: Release

on:
  push:
    branches: [master]
    paths: [neighbot.h]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - name: Extract version
        id: version
        run: |
          ver=$(grep '#define NEIGHBOT_VERSION' neighbot.h | sed 's/.*"\(.*\)"/\1/')
          echo "version=$ver" >> "$GITHUB_OUTPUT"
          echo "tag=v$ver" >> "$GITHUB_OUTPUT"

      - name: Check if release exists
        id: check
        run: |
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create source tarball
        if: steps.check.outputs.exists == 'false'
        run: |
          prefix="neighbot-${{ steps.version.outputs.version }}"
          git archive --format=tar.gz --prefix="${prefix}/" \
            -o "${prefix}.tar.gz" HEAD

      # Tag the commit that was archived: given no tag, gh would create
      # one at the head of master, which may have moved since this run
      # started. Without --target the release keeps the branch as its
      # target, which the package upload needs.
      - name: Create release
        if: steps.check.outputs.exists == 'false'
        run: |
          git tag "$TAG" "$GITHUB_SHA"
          git push origin "refs/tags/$TAG"
          gh release create "$TAG" --verify-tag \
            --title "neighbot ${{ steps.version.outputs.version }}" \
            --generate-notes \
            "neighbot-${{ steps.version.outputs.version }}.tar.gz"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}

      - name: Trigger package builds
        if: steps.check.outputs.exists == 'false'
        run: |
          gh workflow run release-packages.yml \
            -f ref="${{ steps.version.outputs.tag }}" \
            -f release_tag="${{ steps.version.outputs.tag }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
